blueprint:
  name: Thermostat bei geöffnetem Fenster abschalten oder absenken
  description: >
    Schaltet ein Thermostat aus (oder senkt die Solltemperatur ab), sobald
    mindestens ein Fenster für die eingestellte Zeit geöffnet ist.
    Vorher wird der Zustand des Thermostats (Modus, Solltemperatur, Preset usw.)
    in einer Scene gesichert. Zusätzlich wird die Solltemperatur in einem
    Input-Number-Helfer gesichert, der einen Neustart von Home Assistant übersteht.

    Sind danach ALLE Fenster mindestens die eingestellte Wartezeit lang geschlossen
    und ist das Thermostat noch im abgeschalteten bzw. abgesenkten Zustand,
    wird der gespeicherte Zustand wiederhergestellt.
    Wurde das Thermostat in der Zwischenzeit manuell verändert, wird nichts überschrieben.


    **Voraussetzung für den Helfer:** Minimum = 0 (der Wert 0 bedeutet
    "keine Sicherung vorhanden"), Maximum mindestens so hoch wie die höchste
    Solltemperatur (z. B. 35), Schrittweite z. B. 0.5.
    Pro Thermostat wird ein eigener Helfer benötigt.
  domain: automation
  homeassistant:
    min_version: 2024.10.0
  input:
    window_sensors:
      name: Fenstersensoren
      description: >
        Ein oder mehrere Binärsensoren, die "an" sind, wenn das Fenster geöffnet ist.
        Das Thermostat wird erst wiederhergestellt, wenn alle Fenster geschlossen sind.
      selector:
        entity:
          domain: binary_sensor
          multiple: true
    thermostat:
      name: Thermostat
      description: Das Thermostat (climate-Entität), das gesteuert werden soll.
      selector:
        entity:
          domain: climate
    temperature_backup:
      name: Helfer für gesicherte Solltemperatur
      description: >
        Input-Number-Helfer (Einstellungen > Geräte & Dienste > Helfer > Zahl),
        den du frei benennen kannst. Min = 0, Max z. B. 35, Schritt 0.5.
        Hier wird die Solltemperatur gesichert, damit sie auch einen
        Neustart von Home Assistant überlebt.
      selector:
        entity:
          domain: input_number
    open_delay:
      name: Öffnungsverzögerung
      description: >
        So lange muss ein Fenster geöffnet sein, bevor das Thermostat
        abgeschaltet bzw. abgesenkt wird (verhindert Reaktion beim Stoßlüften).
        0 = sofort.
      default:
        hours: 0
        minutes: 0
        seconds: 30
      selector:
        duration:
    wait_time:
      name: Wartezeit nach dem Schließen
      description: >
        So lange müssen alle Fenster geschlossen sein, bevor der
        vorherige Zustand des Thermostats wiederhergestellt wird.
      default:
        hours: 0
        minutes: 5
        seconds: 0
      selector:
        duration:
    lower_temperature:
      name: Absenktemperatur (optional)
      description: >
        Für Thermostate ohne "Aus"-Modus oder wenn nicht komplett ausgeschaltet
        werden soll (Frostschutz): Bei geöffnetem Fenster wird die Solltemperatur
        auf diesen Wert gesenkt. 0 = Thermostat stattdessen ausschalten.
      default: 0
      selector:
        number:
          min: 0
          max: 35
          step: 0.5
          unit_of_measurement: "°C"
          mode: box

# Alle Wartezeiten stecken in den Triggern (for:), die Aktionen laufen kurz.
# "queued" verhindert, dass eine Aktion durch einen zweiten Trigger abgebrochen wird.
mode: queued
max: 10

variables:
  thermostat_entity: !input thermostat
  backup_entity: !input temperature_backup
  windows: !input window_sensors
  wait_time: !input wait_time
  lower_temp: !input lower_temperature
  wait_seconds: >
    {{ (wait_time.days | default(0)) * 86400
       + (wait_time.hours | default(0)) * 3600
       + (wait_time.minutes | default(0)) * 60
       + (wait_time.seconds | default(0)) }}
  # Absenken statt Ausschalten, wenn eine Absenktemperatur > 0 gesetzt ist
  use_lowering: "{{ lower_temp | float(0) > 0 }}"
  # Ist das Thermostat gerade im von der Automation hergestellten Zustand?
  is_lowered: >
    {% set cur = state_attr(thermostat_entity, 'temperature') | float(0) %}
    {{ (not is_state(thermostat_entity, 'off') and cur | round(1) == lower_temp | float(0) | round(1)) if use_lowering else is_state(thermostat_entity, 'off') }}
  # Eindeutige Scene-ID pro Thermostat, damit mehrere Instanzen sich nicht stören
  scene_id: "window_open_backup_{{ thermostat_entity | replace('.', '_') }}"
  scene_entity: "scene.{{ scene_id }}"

triggers:
  # Irgendein Fenster ist die Öffnungsverzögerung lang offen
  - trigger: state
    entity_id: !input window_sensors
    to: "on"
    for: !input open_delay
    id: opened
  # Irgendein Fenster ist die Wartezeit lang geschlossen
  - trigger: state
    entity_id: !input window_sensors
    to: "off"
    for: !input wait_time
    id: closed_wait

actions:
  - choose:
      # --- Fenster wurde (lange genug) geöffnet ---
      - conditions:
          - condition: trigger
            id: opened
          # Nur sichern, wenn das Thermostat aktiv ist und noch nicht abgesenkt wurde
          # (verhindert beim Öffnen eines zweiten Fensters das Überschreiben der Sicherung)
          - condition: template
            value_template: >
              {{ states(thermostat_entity) not in ['off', 'unavailable', 'unknown']
                 and not is_lowered }}
        sequence:
          # Vollständiger Zustand (nur bis zum nächsten HA-Neustart)
          - action: scene.create
            data:
              scene_id: "{{ scene_id }}"
              snapshot_entities:
                - !input thermostat
          # Solltemperatur dauerhaft im Helfer sichern
          - action: input_number.set_value
            target:
              entity_id: !input temperature_backup
            data:
              value: "{{ state_attr(thermostat_entity, 'temperature') | float(0) }}"
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ use_lowering }}"
                sequence:
                  - action: climate.set_temperature
                    target:
                      entity_id: !input thermostat
                    data:
                      temperature: "{{ lower_temp | float(0) }}"
            default:
              - action: climate.set_hvac_mode
                target:
                  entity_id: !input thermostat
                data:
                  hvac_mode: "off"

      # --- Ein Fenster war die Wartezeit lang geschlossen ---
      - conditions:
          - condition: trigger
            id: closed_wait
          # Alle Fenster geschlossen UND keines davon innerhalb der Wartezeit geändert
          - condition: template
            value_template: >
              {% set cutoff = now() - timedelta(seconds=wait_seconds | float(0)) %}
              {{ expand(windows) | rejectattr('state', 'eq', 'off') | list | count == 0
                 and expand(windows) | selectattr('last_changed', 'gt', cutoff) | list | count == 0 }}
        sequence:
          - variables:
              scene_exists: "{{ scene_entity in (states.scene | map(attribute='entity_id') | list) }}"
              stored_temp: "{{ states(backup_entity) | float(0) }}"
          # Nur aktiv werden, wenn diese Automation etwas gesichert hat
          - if:
              - condition: template
                value_template: "{{ scene_exists or stored_temp > 0 }}"
            then:
              # Nur wiederherstellen, wenn das Thermostat noch im abgesenkten/ausgeschalteten Zustand ist
              - if:
                  - condition: template
                    value_template: "{{ is_lowered }}"
                then:
                  - choose:
                      # Normalfall: kompletter Zustand aus der Scene
                      - conditions:
                          - condition: template
                            value_template: "{{ scene_exists }}"
                        sequence:
                          - action: scene.turn_on
                            target:
                              entity_id: "{{ scene_entity }}"
                    # Fallback nach HA-Neustart: Scene ist weg, nur Temperatur bekannt
                    default:
                      - if:
                          - condition: template
                            value_template: "{{ not use_lowering }}"
                        then:
                          - action: climate.set_hvac_mode
                            target:
                              entity_id: !input thermostat
                            data:
                              hvac_mode: heat
                      - action: climate.set_temperature
                        target:
                          entity_id: !input thermostat
                        data:
                          temperature: "{{ stored_temp }}"
              # Aufräumen (auch wenn das Thermostat bereits wieder verändert wurde)
              - if:
                  - condition: template
                    value_template: "{{ scene_exists }}"
                then:
                  - action: scene.delete
                    target:
                      entity_id: "{{ scene_entity }}"
              - action: input_number.set_value
                target:
                  entity_id: !input temperature_backup
                data:
                  value: 0
